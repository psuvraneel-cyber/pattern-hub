[project]
name = "pattern-hub"
version = "0.1.0"
description = "Small, runnable AI-agent architecture patterns."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
# Copy instead of hardlinking from the uv cache. Hardlinks fail inside
# OneDrive-synced folders on Windows (os error 396).
link-mode = "copy"

[tool.uv.workspace]
members = ["patterns/*"]
